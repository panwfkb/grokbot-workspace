name: Notify 云端调度

on:
  push:
    branches: [main]
    paths:
      - 'tasks/**'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: POST webhook
        env:
          WEBHOOK_URL: ${{ secrets.GROKBOT_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.GROKBOT_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ] || [ -z "${WEBHOOK_TOKEN:-}" ]; then
            echo "Missing GROKBOT_WEBHOOK_URL or GROKBOT_WEBHOOK_TOKEN secrets"
            exit 1
          fi
          curl -fsS -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"source\":\"github-actions\",\"repo\":\"$GITHUB_REPOSITORY\",\"sha\":\"$GITHUB_SHA\",\"ref\":\"$GITHUB_REF\",\"task_hint\":\"tasks/\"}"
